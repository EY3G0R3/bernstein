name: Publish
permissions: {}
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != ''
    && inputs.ref || inputs.tag) || github.ref }}
jobs:
  protocol-gate:
    name: Protocol Compatibility Gate
    runs-on: ubuntu-latest
    if: ${{ !inputs.copr_only && !inputs.registry_only }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - uses: ./.github/actions/bootstrap
      with:
        enable-uv-cache: 'false'
    - name: Run protocol compatibility check
      env:
        RELEASE_REF: ${{ env.RELEASE_TAG }}
      run: "set -euo pipefail\n\n# Run protocol tests with protocol packages injected\
        \ by uv.\n# Bare uv package installation fails on tag runners before\n# the\
        \ first `uv run` creates the project environment.\nset +e\nuv run --with mcp\
        \ --with a2a pytest tests/protocol/ -v 2>&1 | tee test-output.log\npytest_exit_code=${PIPESTATUS[0]}\n\
        set -e\n\n# Generate results\nPYTEST_EXIT_CODE=\"$pytest_exit_code\" python\
        \ << 'EOF'\nimport json\nimport os\n\nresults = []\npytest_exit_code = int(os.environ[\"\
        PYTEST_EXIT_CODE\"])\nstatus = \"pass\" if pytest_exit_code == 0 else \"fail\"\
        \n\nresult = {\n  \"python\": \"3.12\",\n  \"mcp\": \"1.0\",\n  \"a2a\": \"\
        0.2\",\n  \"status\": status\n}\nresults.append(result)\n\ncompat_data = {\n\
        \  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"release\": os.environ.get(\"\
        RELEASE_REF\", \"\"),\n  \"results\": results\n}\n\nwith open('release-compat-results.json',\
        \ 'w') as f:\n    json.dump(compat_data, f, indent=2)\nEOF\n\nexit \"$pytest_exit_code\"\
        \n"
    - name: Check against baseline
      run: "python scripts/check_compatibility.py \\\n  --current-results release-compat-results.json\
        \ \\\n  --baseline tests/protocol/compatibility-baseline.json 2>&1 | tee gate-check.log\n"
    - name: Gate decision
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: "if grep -q \"ACKNOWLEDGE_BREAKING_CHANGES\" <<< \"$COMMIT_MSG\"; then\n\
        \  echo \"\u2705 Operator acknowledged breaking changes\"\n  exit 0\nfi\n\n\
        if grep -q '\"breaking_changes\": \\[\\]' gate-check.log; then\n  echo \"\u2705\
        \ Gate passed - no breaking changes detected\"\n  exit 0\nelse\n  echo \"\u274C\
        \ Release blocked - breaking changes detected\"\n  echo \"To proceed: include\
        \ 'ACKNOWLEDGE_BREAKING_CHANGES' in commit message\"\n  exit 1\nfi\n"
  test:
    name: Verify tests pass
    runs-on: ubuntu-latest
    if: ${{ !inputs.copr_only && !inputs.registry_only }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - uses: ./.github/actions/bootstrap
      with:
        enable-uv-cache: 'false'
    - name: Quick lint check (full tests already passed in CI)
      run: uv run ruff check src/
    - name: Release test guard
      run: uv run python scripts/run_tests.py -k release -x
  version-check:
    name: Verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    if: ${{ !inputs.copr_only && !inputs.registry_only }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - name: Compare tag to pyproject.toml version
      run: "TAG=\"${RELEASE_TAG#v}\"\nPKG=$(grep '^version = ' pyproject.toml | head\
        \ -1 | sed 's/version = \"\\(.*\\)\"/\\1/')\necho \"Tag version:    $TAG\"\
        \necho \"Package version: $PKG\"\nif [ \"$TAG\" != \"$PKG\" ]; then\n  echo\
        \ \"::error::Tag v$TAG does not match pyproject.toml version $PKG\"\n  exit\
        \ 1\nfi\n"
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
    - test
    - protocol-gate
    - version-check
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - uses: ./.github/actions/bootstrap
      with:
        enable-uv-cache: 'false'
    - run: uv build
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dist
        path: dist/
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/bernstein
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: dist
        path: dist/
    - name: Attest build provenance (Sigstore)
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: dist/*
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        skip-existing: true
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment: release-channels
    permissions:
      contents: write
      actions: write
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: dist
        path: dist/
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\n\nTAG=\"${RELEASE_TAG}\"\nNOTES_FILE=\"docs/release-notes/${TAG}.md\"\
        \nBODY=\"${RUNNER_TEMP:-/tmp}/release-body.md\"\n\n# The release page carries\
        \ the notes written for this version, with\n# the generated changelog (and\
        \ the contributor credits in it) below\n# them. `--generate-notes` on its\
        \ own publishes the machine changelog\n# as the entire body, which is what\
        \ every release shipped with until\n# someone rewrote the page by hand after\
        \ the tag was already public.\n: > \"$BODY\"\nif [ -f \"$NOTES_FILE\" ]; then\n\
        \  # The page already shows the tag, so drop the file's own H1.\n  awk 'NR\
        \ == 1 && /^# / { next } { print }' \"$NOTES_FILE\" >> \"$BODY\"\n  printf\
        \ '\\n---\\n\\n' >> \"$BODY\"\nelse\n  echo \"::warning::$NOTES_FILE is missing;\
        \ the page will carry only the generated changelog\"\nfi\ngh api \"repos/${GITHUB_REPOSITORY}/releases/generate-notes\"\
        \ \\\n  -f tag_name=\"$TAG\" --jq .body >> \"$BODY\"\n\nif gh release view\
        \ \"$TAG\" >/dev/null 2>&1; then\n  gh release upload \"$TAG\" dist/* --clobber\n\
        else\n  gh release create \"$TAG\" dist/* \\\n    --title \"$TAG\" \\\n  \
        \  --notes-file \"$BODY\"\nfi\n\nasset_count=$(gh release view \"$TAG\" --json\
        \ assets --jq '.assets | length')\nif [ \"$asset_count\" -eq 0 ]; then\n \
        \ echo \"::error::Release $TAG has no assets\"\n  exit 1\nfi\n"
    - name: Dispatch docker publish (release event from GITHUB_TOKEN does not trigger
        it)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ env.RELEASE_TAG }}
      run: gh workflow run publish-docker.yml --ref main -f tag="$TAG"
    - name: Dispatch Homebrew formula publish (release event from GITHUB_TOKEN does
        not trigger it)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ env.RELEASE_TAG }}
      run: gh workflow run publish-homebrew.yml --ref main -f version="${TAG#v}"
    - name: Dispatch SBOM generation (release event from GITHUB_TOKEN does not trigger
        it)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ env.RELEASE_TAG }}
      run: gh workflow run sbom.yml --ref main -f ref="$TAG"
  publish-npm:
    name: Publish npm wrapper
    runs-on: ubuntu-latest
    environment: release-channels
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - name: Sync version from tag
      run: 'VERSION="${RELEASE_TAG#v}"

        cd packaging/npm

        npm version "$VERSION" --no-git-tag-version --allow-same-version

        '
    - name: Publish to npm
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: "set -uo pipefail\nif [ -z \"${NPM_TOKEN:-}\" ]; then\n  echo \"::error::NPM_TOKEN\
        \ is not configured; the npm wrapper cannot be published\"\n  exit 1\nfi\n\
        cd packaging/npm\n# This step used to demote every publish failure to a ::warning,\
        \ so an\n# unauthorised token produced a green job while the registry kept\n\
        # serving the last version that did publish. Exactly one failure is\n# legitimately\
        \ non-fatal: the version is already on the registry,\n# which happens when\
        \ this job runs twice for the same tag (a workflow\n# re-run, or the tag-push\
        \ and workflow_dispatch triggers racing).\n# npm reports that as EPUBLISHCONFLICT;\
        \ older clients report an E403\n# \"cannot publish over the previously published\
        \ versions\". Everything\n# else -- including the \"Not Found\" the registry\
        \ returns for a token\n# without publish rights on the package -- fails the\
        \ job.\n#\n# GitHub runs this step under `bash -e`, so errexit is disabled\n\
        # around the capture; without it the `out=$(...)` assignment would\n# abort\
        \ the step before the exit code can be classified.\nset +e\nout=$(npm publish\
        \ --access public 2>&1)\ncode=$?\nset -e\nprintf '%s\\n' \"$out\"\nif [ \"\
        $code\" -eq 0 ]; then\n  exit 0\nfi\nif printf '%s' \"$out\" \\\n  | grep\
        \ -qiE 'EPUBLISHCONFLICT|cannot publish over the previously published version';\
        \ then\n  echo \"::notice::npm wrapper version is already on the registry;\
        \ treating the conflict as success (idempotent)\"\n  exit 0\nfi\necho \"::error::npm\
        \ wrapper publish failed (exit ${code}); the registry is now behind this release\"\
        \nexit \"$code\"\n"
  rpm-install-smoke:
    name: RPM install smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ always() && (inputs.copr_only || needs.publish.result == 'success') }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
        - fedora:43
        - fedora:44
        - quay.io/centos/centos:stream9
        - quay.io/centos/centos:stream10
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.copr_only && github.ref || inputs.tag || github.ref }}
        persist-credentials: false
    - name: Wait for the release to be visible on PyPI
      run: 'set -euo pipefail

        VERSION="${RELEASE_TAG#v}"

        # The spec installs `bernstein==VERSION` from PyPI at build time and

        # the index can lag the publish by a short window. Distinguish

        # "not yet visible" from "the RPM is broken" by waiting here, with

        # a bounded budget, before the smoke starts.

        #

        # The wait polls the simple index rather than the JSON API: they are

        # separate caches with separate propagation, and `pip` resolves

        # against the index. Polling the JSON API let a green wait be

        # followed by `No matching distribution found` (#3815).

        python3 scripts/wait_for_pypi_visibility.py "${VERSION}"

        '
    - name: Build the RPM, install it, run it offline
      env:
        SMOKE_IMAGE: ${{ matrix.image }}
      run: 'set -euo pipefail

        scripts/rpm_install_smoke.sh "${SMOKE_IMAGE}" "${RELEASE_TAG#v}"

        '
  publish-copr:
    name: Publish RPM to Copr
    runs-on: ubuntu-latest
    environment: pypi
    needs:
    - publish
    - rpm-install-smoke
    if: ${{ always() && needs.rpm-install-smoke.result == 'success' && (inputs.copr_only
      || needs.publish.result == 'success') }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COPR_PROJECT: alexchernysh/bernstein
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.copr_only && github.ref || inputs.tag || github.ref }}
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install rpmbuild and copr-cli
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends rpm

        # Pinned: an unpinned installer lets an upstream release change what

        # runs in the job that holds the publishing credential.

        #

        # 2.4 rather than 2.5: 2.5 imports `rich` at module scope but

        # declares only `copr, humanize, jinja2, setuptools`, so a clean

        # install of it produces a CLI that cannot start.

        python3 -m pip install --disable-pip-version-check "copr-cli==2.4"

        command -v rpmbuild

        # Run the CLI once here: an install that cannot import fails in this

        # step rather than after the API token is written to disk.

        copr-cli --version

        '
    - name: Write copr-cli configuration
      env:
        COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      run: "set -euo pipefail\nif [ -z \"${COPR_CONFIG:-}\" ]; then\n  echo \"::error::COPR_CONFIG\
        \ secret is not configured; the RPM channel cannot publish\"\n  exit 1\nfi\n\
        mkdir -p ~/.config\nprintf '%s\\n' \"${COPR_CONFIG}\" > ~/.config/copr\n#\
        \ copr-cli reads an API token from this file; keep it owner-only.\nchmod 600\
        \ ~/.config/copr\n"
    - name: Build the source RPM at the release version
      id: srpm
      run: 'set -euo pipefail

        VERSION="${RELEASE_TAG#v}"

        SRPM=$(python3 scripts/build_copr_srpm.py --version "${VERSION}" --outdir
        "${RUNNER_TEMP}/copr")

        echo "built ${SRPM}"

        echo "path=${SRPM}" >> "$GITHUB_OUTPUT"

        '
    - name: Submit build to Copr
      env:
        SRPM_PATH: ${{ steps.srpm.outputs.path }}
        COPR_WATCH_SECONDS: '900'
      run: "set -euo pipefail\necho \"submitting ${SRPM_PATH} to ${COPR_PROJECT}\"\
        \n# copr-cli exits non-zero when Copr rejects the submission, so a bad\n#\
        \ SRPM or an expired token fails right here.\ncopr-cli build --nowait \"${COPR_PROJECT}\"\
        \ \"${SRPM_PATH}\" | tee \"${RUNNER_TEMP}/copr-submit.log\"\n\nBUILD_ID=$(sed\
        \ -n 's/^Created builds: \\([0-9][0-9]*\\).*$/\\1/p' \"${RUNNER_TEMP}/copr-submit.log\"\
        \ | head -1)\nif [ -z \"${BUILD_ID}\" ]; then\n  echo \"::error::Copr accepted\
        \ no build id; the submission output above is the evidence\"\n  exit 1\nfi\n\
        \n# Terminal-state handling lives in the watcher, which is unit-tested;\n\
        # a failed build fails this step, and a build still queued at the\n# deadline\
        \ is handed to reconcile-release.yml.\npython3 scripts/copr_build_watch.py\
        \ \\\n  --build-id \"${BUILD_ID}\" \\\n  --deadline-seconds \"${COPR_WATCH_SECONDS}\"\
        \n"
  publish-mcp-registry:
    name: Publish MCP registry listing
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ always() && (inputs.registry_only || needs.publish.result == 'success')
      }}
    timeout-minutes: 25
    continue-on-error: true
    environment: release-channels
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Harden runner (audit mode)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.CHECKOUT_REF }}
        persist-credentials: false
    - name: Check server.json version matches the release tag
      run: "set -euo pipefail\nVERSION=\"${RELEASE_TAG#v}\"\nMANIFEST_VERSION=$(python3\
        \ -c \"import json; print(json.load(open('server.json'))['version'])\")\n\
        if [ \"$MANIFEST_VERSION\" != \"$VERSION\" ]; then\n  echo \"::error::server.json\
        \ version $MANIFEST_VERSION does not match release $VERSION\"\n  exit 1\n\
        fi\n"
    - name: Check docker-mcp catalog source.commit matches the release commit
      env:
        REGISTRY_ONLY: ${{ inputs.registry_only }}
      run: "set -euo pipefail\n# server.yaml is hand-maintained: the commit hash cannot\
        \ be known\n# before the release commit exists, so nothing regenerates it.\
        \ This\n# step catches a forgotten refresh before the catalog PR ships a\n\
        # source.commit that does not point at the release being submitted.\n#\n#\
        \ The docker-mcp catalog is a separate channel from the registry\n# listing\
        \ this job submits, so it does not get to block a\n# registry-only republish\
        \ -- a stale pin here is worth flagging,\n# not worth losing the listing over.\n\
        python3 - <<'PY'\nimport os\nimport re\nimport subprocess\nfrom pathlib import\
        \ Path\n\nregistry_only = os.environ.get(\"REGISTRY_ONLY\") == \"true\"\n\
        annotation = \"warning\" if registry_only else \"error\"\n\ndef report(message:\
        \ str) -> None:\n    print(f\"::{annotation}::{message}\")\n    if not registry_only:\n\
        \        raise SystemExit(1)\n\ntext = Path(\"packaging/docker-mcp/server.yaml\"\
        ).read_text(encoding=\"utf-8\")\nmatch = re.search(r\"^  commit:\\s*([0-9a-f]{40})\\\
        s*$\", text, re.MULTILINE)\nif not match:\n    report(\"packaging/docker-mcp/server.yaml\
        \ has no valid source.commit (40-char lowercase hex SHA)\")\nelse:\n    pinned\
        \ = match.group(1)\n    head = subprocess.run(\n        [\"git\", \"rev-parse\"\
        , \"HEAD\"], capture_output=True, text=True, check=True\n    ).stdout.strip()\n\
        \    if pinned != head:\n        report(\n            f\"packaging/docker-mcp/server.yaml\
        \ source.commit {pinned} does not match \"\n            f\"the release commit\
        \ {head}; refresh it before opening the catalog PR\"\n        )\nPY\n"
    - name: Install mcp-publisher
      env:
        MCP_PUBLISHER_VERSION: v1.8.0
        MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
      run: "set -euo pipefail\n# This job holds id-token: write, so the publisher\
        \ binary must be\n# pinned and integrity-checked before it runs. A moving\
        \ \"latest\"\n# download would let an upstream tag change what executes here;\n\
        # instead fetch a pinned immutable release-tag asset and verify it\n# against\
        \ a sha256 recorded at authoring time before extract/execute.\nOS=$(uname\
        \ -s | tr '[:upper:]' '[:lower:]')\nARCH=$(uname -m)\nif [ \"$OS\" != \"linux\"\
        \ ] || [ \"$ARCH\" != \"x86_64\" ]; then\n  echo \"::error::pinned mcp-publisher\
        \ checksum covers linux/amd64 only; runner is ${OS}/${ARCH}\"\n  exit 1\n\
        fi\nasset=\"mcp-publisher_linux_amd64.tar.gz\"\ncurl -fsSL \\\n  \"https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}\"\
        \ \\\n  -o \"$asset\"\necho \"${MCP_PUBLISHER_SHA256}  ${asset}\" | sha256sum\
        \ -c -\ntar xz -f \"$asset\" mcp-publisher\nrm -f \"$asset\"\n./mcp-publisher\
        \ --version\n"
    - name: Wait for the release image in GHCR
      id: waitimg
      run: "set -uo pipefail\n# The MCP registry validates that every OCI package\
        \ in the listing\n# resolves in its registry before it accepts the submission.\
        \ The GHCR\n# image is built by publish-docker.yml, which the github-release\
        \ job\n# dispatches in parallel with this job, so the image is usually still\n\
        # building when this job reaches the publish step. Submitting then\n# returns\
        \ HTTP 400 \"OCI image ... does not exist in the registry\" and\n# the listing\
        \ is dropped for that release. Poll GHCR for the exact\n# reference the listing\
        \ pins and only publish once it resolves.\nOCI_REF=$(python3 -c \"import json;\
        \ pkgs=json.load(open('server.json')).get('packages',[]); print(next((p['identifier']\
        \ for p in pkgs if p.get('registryType')=='oci'), ''))\")\nif [ -z \"$OCI_REF\"\
        \ ]; then\n  echo \"::notice::server.json has no OCI package; nothing to wait\
        \ for\"\n  echo \"image_present=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\
        echo \"listing pins OCI image: $OCI_REF\"\n# ghcr.io/OWNER/NAME:VERSION ->\
        \ host / repo : tag\nhost=\"${OCI_REF%%/*}\"\nrest=\"${OCI_REF#*/}\"\nrepo=\"\
        ${rest%:*}\"\ntag=\"${rest##*:}\"\nmanifest_url=\"https://${host}/v2/${repo}/manifests/${tag}\"\
        \ntoken_url=\"https://${host}/token?scope=repository:${repo}:pull\"\naccept=\"\
        application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json\"\
        \n# Up to ~18 min covers the observed cold-cache GHCR build window\n# (~1.5-14\
        \ min) with headroom; poll every 20s.\ndeadline=$(( $(date +%s) + 1080 ))\n\
        attempt=0\nwhile :; do\n  attempt=$((attempt + 1))\n  token=$(curl -fsSL \"\
        $token_url\" | python3 -c \"import sys,json; print(json.load(sys.stdin).get('token',''))\"\
        \ 2>/dev/null || true)\n  status=$(curl -s -o /dev/null -w \"%{http_code}\"\
        \ -H \"Authorization: Bearer ${token}\" -H \"Accept: ${accept}\" \"$manifest_url\"\
        \ || echo \"000\")\n  if [ \"$status\" = \"200\" ]; then\n    echo \"image\
        \ present after ${attempt} attempt(s): ${OCI_REF}\"\n    echo \"image_present=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\n  if [ \"$(date +%s)\" -ge \"$deadline\"\
        \ ]; then\n    echo \"::warning::${OCI_REF} did not resolve in GHCR within\
        \ the wait window (last status ${status}); skipping the MCP registry publish.\
        \ Re-run this job once publish-docker.yml has pushed the image; the publish\
        \ is idempotent.\"\n    echo \"image_present=false\" >> \"$GITHUB_OUTPUT\"\
        \n    exit 0\n  fi\n  echo \"attempt ${attempt}: image not ready yet (status\
        \ ${status}); retrying in 20s\"\n  sleep 20\ndone\n"
    - name: Publish server.json
      if: steps.waitimg.outputs.image_present == 'true'
      run: "set -uo pipefail\n./mcp-publisher login github-oidc\n# GitHub runs this\
        \ step under `bash -e`, so without disabling\n# errexit the `out=$(...)` capture\
        \ below would abort the step on\n# the publisher's non-zero exit before we\
        \ can inspect the error.\n# Turn errexit off here so the duplicate-version\
        \ branch can run\n# and the real exit code is captured in `code`.\nset +e\n\
        # Idempotent publish: the registry rejects re-submitting a version that\n\
        # is already live with an HTTP 400 \"cannot publish duplicate version\".\n\
        # That happens whenever this job runs more than once for the same\n# release\
        \ (a workflow re-run, or the tag-push and workflow_dispatch\n# triggers racing\
        \ to publish the same server.json). The listing is\n# already correct in that\
        \ case, so a duplicate is a success, not a\n# failure \u2014 swallow it and\
        \ let any other error still fail the step.\nout=$(./mcp-publisher publish\
        \ 2>&1)\ncode=$?\nprintf '%s\\n' \"$out\"\nif [ \"$code\" -ne 0 ]; then\n\
        \  if printf '%s' \"$out\" | grep -qi \"duplicate version\"; then\n    echo\
        \ \"::notice::version already present in the MCP registry; treating duplicate\
        \ as success (idempotent)\"\n    exit 0\n  fi\n  exit \"$code\"\nfi\n"
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v2.8.1)
        required: true
        type: string
      copr_only:
        description: Run only the Copr RPM publish for the given tag
        required: false
        default: false
        type: boolean
      registry_only:
        description: Run only the MCP registry publish for the given tag
        required: false
        default: false
        type: boolean
      ref:
        description: Git ref to checkout (branch, tag, or commit). Defaults to the
          tag to publish.
        required: false
        type: string
